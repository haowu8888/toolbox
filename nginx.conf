server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 反向代理使用运行时 DNS 解析（Yahoo Finance 的 IP 会变化）
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # 安全头（nginx 的 add_header 不会被子 location 继承，需要自定义头的 location 会重复声明）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://dns.google https://ipapi.co https://api.gold-api.com https://api.frankfurter.dev; font-src 'self' data:; manifest-src 'self'; worker-src 'self' blob:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 金属行情走势图：同源代理到 Yahoo Finance，只放行三个允许的合约代码
    location ~ "^/api/finance/chart/(GC|SI|HG)=F$" {
        set $ticker $1;
        proxy_pass https://query1.finance.yahoo.com/v8/finance/chart/$ticker=F$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host query1.finance.yahoo.com;
        proxy_set_header User-Agent "toolbox-nginx-proxy/1.0";
        proxy_set_header Accept "application/json";
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        expires 60s;
    }

    location /api/ {
        return 404;
    }

    # Service Worker 与入口页不缓存，确保每次拿到最新版本
    location = /sw.js {
        expires epoch;
        try_files $uri =404;
    }

    location = /index.html {
        expires epoch;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires epoch;
    }

    # 静态资源长缓存（Vite 构建产物带 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://dns.google https://ipapi.co https://api.gold-api.com https://api.frankfurter.dev; font-src 'self' data:; manifest-src 'self'; worker-src 'self' blob:;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        expires epoch;
    }

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/manifest+json;
    gzip_min_length 1000;
}
